<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ecqqo | Your AI executive assistant in WhatsApp</title>
    <meta name="description" content="Ecqqo is an AI executive assistant that lives in WhatsApp. It alerts you to urgent messages, books meetings, drafts email, sets reminders and sends briefings across Gmail, Google Calendar and Outlook." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)" />
    <meta property="og:site_name" content="Ecqqo" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ecqqo | Never ghost an important conversation again" />
    <meta property="og:description" content="Your AI executive assistant in WhatsApp. Urgent-message alerts, meetings, email, reminders and briefings from one chat." />
    <meta property="og:url" content="https://ecqqo.com/" />
    <meta property="og:image" content="https://ecqqo.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ecqqo | Never ghost an important conversation again" />
    <meta name="twitter:description" content="Your AI executive assistant in WhatsApp." />
    <meta name="twitter:image" content="https://ecqqo.com/og-image.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-icon-180x180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme !== "light" && theme !== "dark") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        if (localStorage.getItem("ecqqo-locale") === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
